<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>墨韵科技 · 云盘</title>
<meta name="description" content="墨韵科技云端存储 —— 密码取件，安全下载">
<style>
:root{
  --bg:#f4f1e9;
  --panel:#fffdf9;
  --ink:#1b1b1b;
  --ink-2:#5a5750;
  --ink-3:#9a968d;
  --line:#e7e2d7;
  --accent:#2b4c7e;
  --accent-2:#3d67a3;
  --seal:#a83a2c;
  --ok:#2f7a53;
  --r:14px;
  --shadow:0 1px 2px rgba(30,25,15,.04), 0 12px 32px rgba(30,25,15,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.6;
  font-size:15px;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(circle at 15% 8%, rgba(43,76,126,.055), transparent 45%),
    radial-gradient(circle at 85% 85%, rgba(168,58,44,.045), transparent 45%);
}
.wrap{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:0 18px 80px}

/* ---------- 顶栏 ---------- */
.topbar{
  position:relative;z-index:1;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  max-width:960px;margin:0 auto;padding:26px 18px 20px;
}
.brand{display:flex;align-items:center;gap:13px}
.seal{
  width:46px;height:46px;flex:0 0 46px;border-radius:11px;
  background:linear-gradient(145deg,#b8402f,#8d2a1f);
  color:#fff;display:grid;place-items:center;
  font-size:22px;font-weight:700;letter-spacing:1px;
  box-shadow:0 6px 16px rgba(168,58,44,.28);
  font-family:"Songti SC","STSong",serif;
}
.brand h1{margin:0;font-size:19px;font-weight:700;letter-spacing:2px}
.brand p{margin:1px 0 0;font-size:12px;color:var(--ink-3);letter-spacing:1.5px}
.user-area{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2)}
.user-chip{
  display:flex;align-items:center;gap:7px;
  background:var(--panel);border:1px solid var(--line);border-radius:999px;
  padding:6px 14px;box-shadow:0 1px 2px rgba(30,25,15,.03);
}
.user-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}

/* ---------- 卡片 ---------- */
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:24px;margin-bottom:20px;
}
.card h2{
  margin:0 0 4px;font-size:16px;font-weight:700;letter-spacing:1px;
  display:flex;align-items:center;gap:9px;
}
.card h2 .ico{font-size:18px}
.card .sub{margin:0 0 18px;font-size:13px;color:var(--ink-3)}

/* ---------- 表单 ---------- */
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--ink-2);margin-bottom:6px;font-weight:500}
.input{
  width:100%;padding:11px 14px;font-size:15px;font-family:inherit;
  background:#fff;border:1px solid var(--line);border-radius:10px;
  color:var(--ink);outline:none;transition:border-color .18s, box-shadow .18s;
}
.input:focus{border-color:var(--accent-2);box-shadow:0 0 0 3px rgba(61,103,163,.12)}
.input::placeholder{color:#b9b5ac}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:11px 22px;font-size:14px;font-family:inherit;font-weight:600;
  border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink-2);
  cursor:pointer;transition:all .18s;letter-spacing:.5px;white-space:nowrap;
}
.btn:hover{background:#faf8f3;border-color:#d9d3c5}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn.primary{
  background:linear-gradient(145deg,var(--accent-2),var(--accent));
  border-color:transparent;color:#fff;
  box-shadow:0 4px 14px rgba(43,76,126,.25);
}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--seal);border-color:#eddcd8}
.btn.danger:hover{background:#fdf4f2;border-color:#e3c7c1}
.btn.sm{padding:6px 13px;font-size:12.5px;border-radius:8px;font-weight:500}
.btn.block{width:100%}

/* ---------- 上传区 ---------- */
.drop{
  border:1.5px dashed #d8d2c4;border-radius:12px;padding:30px 20px;
  text-align:center;cursor:pointer;transition:all .2s;background:#fdfbf6;
}
.drop:hover,.drop.over{border-color:var(--accent-2);background:#f7f9fd}
.drop .big{font-size:30px;display:block;margin-bottom:8px;opacity:.75}
.drop .t{font-size:14px;color:var(--ink-2);font-weight:500}
.drop .h{font-size:12px;color:var(--ink-3);margin-top:5px}
.picked{
  display:flex;align-items:center;gap:11px;padding:12px 14px;
  background:#f3f7fd;border:1px solid #d8e3f3;border-radius:11px;margin-bottom:14px;
}
.picked .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:500}
.picked .sz{font-size:12px;color:var(--ink-3);flex:0 0 auto}

.bar{height:6px;background:#eae5da;border-radius:99px;overflow:hidden;margin:14px 0 6px}
.bar > i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--accent-2),var(--accent));transition:width .25s}
.bar-txt{font-size:12px;color:var(--ink-3);text-align:center}

/* ---------- 文件列表 ---------- */
.file{
  display:flex;align-items:center;gap:14px;padding:14px 4px;
  border-bottom:1px solid var(--line);
}
.file:last-child{border-bottom:none}
.file .fi{
  width:40px;height:40px;flex:0 0 40px;border-radius:10px;
  background:#f2efe7;display:grid;place-items:center;font-size:18px;
}
.file .fm{flex:1;min-width:0}
.file .fn{
  font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;margin-bottom:2px;
}
.file .meta{font-size:12px;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:4px 10px}
.file .meta .tag{
  background:#eef3fb;color:var(--accent);border-radius:5px;padding:0 6px;
  font-size:11px;line-height:17px;
}
.file .acts{display:flex;gap:6px;flex:0 0 auto;flex-wrap:wrap;justify-content:flex-end}

.empty{text-align:center;padding:34px 10px;color:var(--ink-3);font-size:13.5px}
.empty .big{font-size:32px;display:block;margin-bottom:10px;opacity:.4}

/* ---------- 提示 ---------- */
#toast{
  position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);
  z-index:99;display:flex;flex-direction:column;gap:9px;align-items:center;
  pointer-events:none;width:calc(100% - 32px);max-width:420px;
}
.toast{
  padding:11px 20px;border-radius:11px;font-size:13.5px;font-weight:500;
  background:#fff;border:1px solid var(--line);color:var(--ink);
  box-shadow:0 10px 30px rgba(30,25,15,.14);
  opacity:0;transform:translateY(12px);transition:all .28s;
  max-width:100%;
}
.toast.show{opacity:1;transform:translateY(0)}
.toast.ok{border-color:#cbe6d6;background:#f4fbf7;color:#1f6b47}
.toast.error{border-color:#efd3cd;background:#fdf6f4;color:#9c3627}

.hidden{display:none !important}

@media (max-width:620px){
  .card{padding:19px 16px}
  .file{flex-wrap:wrap}
  .file .acts{width:100%;justify-content:flex-start;padding-left:54px}
  .topbar{padding:18px 16px 14px}
  .brand h1{font-size:17px}
  .brand p{display:none}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="seal">墨</div>
    <div>
      <h1>墨韵科技</h1>
      <p>云端存储 · 密码取件</p>
    </div>
  </div>
  <div class="user-area" id="userArea"></div>
</header>

<div class="wrap">

  <!-- 登录 -->
  <section class="card hidden" id="loginPanel">
    <h2><span class="ico">🔑</span>所有者登录</h2>
    <p class="sub">仅所有者可上传与管理文件，其他访客可直接使用下方提取功能</p>
    <div class="field">
      <label>用户名</label>
      <input class="input" id="loginUser" placeholder="请输入用户名" autocomplete="username">
    </div>
    <div class="field">
      <label>密码</label>
      <input class="input" id="loginPass" type="password" placeholder="请输入密码" autocomplete="current-password">
    </div>
    <button class="btn primary block" id="loginBtn">登 录</button>
  </section>

  <!-- 提取下载（所有人） -->
  <section class="card" id="fetchPanel">
    <h2><span class="ico">📦</span>提取文件</h2>
    <p class="sub">输入文件 ID 与下载密码，即可获取文件</p>
    <div class="field">
      <label>文件 ID</label>
      <input class="input" id="fetchId" placeholder="例如 3f2a9c10-... 或点击分享链接自动填写" spellcheck="false">
    </div>
    <div class="field">
      <label>下载密码</label>
      <input class="input" id="fetchPwd" type="password" placeholder="请输入下载密码" autocomplete="off">
    </div>
    <button class="btn primary block" id="fetchBtn">提取并下载</button>
  </section>

  <!-- 上传（仅所有者） -->
  <section class="card hidden" id="uploadPanel">
    <h2><span class="ico">⬆️</span>上传文件</h2>
    <p class="sub">单文件最大 500 MB，上传后请妥善保管下载密码</p>

    <div class="drop" id="drop">
      <span class="big">📁</span>
      <div class="t">点击选择文件，或将文件拖拽到此处</div>
      <div class="h">任意格式 · 单文件 ≤ 500 MB</div>
    </div>
    <input type="file" id="fileInput" class="hidden">

    <div class="picked hidden" id="picked">
      <span style="font-size:19px">📄</span>
      <div class="nm" id="pickedName"></div>
      <div class="sz" id="pickedSize"></div>
      <button class="btn sm" id="clearPick">移除</button>
    </div>

    <div class="field">
      <label>下载密码（4-128 位，必填）</label>
      <input class="input" id="uploadPwd" type="text" placeholder="设置一个下载密码" autocomplete="off">
    </div>
    <div class="field">
      <label>备注（可选）</label>
      <input class="input" id="uploadNote" placeholder="例如：给张三的设计稿" maxlength="200">
    </div>

    <div class="bar hidden" id="progressBar"><i></i></div>
    <div class="bar-txt hidden" id="progressTxt"></div>

    <button class="btn primary block" id="uploadBtn" style="margin-top:6px">开始上传</button>
  </section>

  <!-- 文件列表（仅所有者） -->
  <section class="card hidden" id="filesPanel">
    <h2><span class="ico">🗂️</span>我的文件</h2>
    <p class="sub" id="filesSub">加载中…</p>
    <div id="fileList"></div>
  </section>

</div>

<div id="toast"></div>

<script>
/* ============================================================
   配置
   —— 前后端分离部署（本页在别的域名）：填后端完整地址
   —— 同源部署（本页放在后端同目录、由 server.js 提供）：改成 ''
   ============================================================ */
const API_BASE = 'https://myzlm.serveousercontent.com';

/* ---------------- 基础工具 ---------------- */
const $ = s => document.querySelector(s);

let csrfToken = '';
let me = null;
let pickedFile = null;
let myFiles = [];

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}

function fmtSize(n){
  if (typeof n !== 'number' || isNaN(n)) return '-';
  const u = ['B','KB','MB','GB','TB'];
  let i = 0, v = n;
  while (v >= 1024 && i < u.length - 1){ v /= 1024; i++; }
  return (i === 0 ? v : v.toFixed(v >= 100 ? 0 : 1)) + ' ' + u[i];
}

function fmtTime(iso){
  if (!iso) return '-';
  const d = new Date(iso);
  if (isNaN(d)) return '-';
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

let toastTimer = [];
function toast(msg, type){
  const box = $('#toast');
  const el = document.createElement('div');
  el.className = 'toast ' + (type || '');
  el.textContent = msg;
  box.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => el.remove(), 320);
  }, 3200);
}

/* ---------------- 请求封装 ---------------- */
async function api(path, opts){
  opts = opts || {};
  const headers = Object.assign({}, opts.headers || {});
  if (opts.body && typeof opts.body === 'string') headers['Content-Type'] = 'application/json';
  const method = (opts.method || 'GET').toUpperCase();
  if (csrfToken && method !== 'GET' && method !== 'HEAD') headers['X-CSRF-Token'] = csrfToken;

  let res;
  try {
    res = await fetch(API_BASE + path, Object.assign({}, opts, { headers, credentials: 'include' }));
  } catch (e) {
    throw new Error('无法连接服务器，请检查网络');
  }
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch (_) { data = { error: text }; }
  if (!res.ok) throw new Error((data && data.error) || ('请求失败（' + res.status + '）'));
  return data;
}

/* ---------------- 初始化 ---------------- */
async function init(){
  // 分享链接自动填 ID
  const params = new URLSearchParams(location.search);
  const fid = params.get('f') || params.get('id');
  if (fid) {
    $('#fetchId').value = fid;
    setTimeout(() => $('#fetchPwd').focus(), 300);
  }

  try {
    me = await api('/api/me');
  } catch (e) {
    toast(e.message, 'error');
    me = null;
  }

  if (me && me.csrfToken) csrfToken = me.csrfToken;
  renderUser();
  renderPanels();
  if (me && me.role === 'owner') loadFiles();
}

function renderUser(){
  const area = $('#userArea');
  if (me){
    const roleName = me.role === 'owner' ? '所有者' : me.role === 'admin' ? '管理员' : '成员';
    area.innerHTML =
      `<div class="user-chip"><span class="dot"></span>${esc(me.username)} · ${roleName}</div>
       <button class="btn sm" id="logoutBtn">退出</button>`;
    $('#logoutBtn').onclick = doLogout;
  } else {
    area.innerHTML = `<button class="btn sm" id="showLogin">所有者登录</button>`;
    $('#showLogin').onclick = () => {
      $('#loginPanel').classList.remove('hidden');
      $('#loginUser').focus();
      $('#loginPanel').scrollIntoView({ behavior:'smooth', block:'center' });
    };
  }
}

function renderPanels(){
  const isOwner = !!(me && me.role === 'owner');
  $('#loginPanel').classList.toggle('hidden', !!me);
  $('#uploadPanel').classList.toggle('hidden', !isOwner);
  $('#filesPanel').classList.toggle('hidden', !isOwner);
}

/* ---------------- 登录 / 登出 ---------------- */
$('#loginBtn').onclick = async () => {
  const username = $('#loginUser').value.trim();
  const password = $('#loginPass').value;
  if (!username || !password) return toast('请输入用户名和密码', 'error');

  const btn = $('#loginBtn');
  btn.disabled = true; btn.textContent = '登录中…';
  try {
    const data = await api('/api/login', {
      method: 'POST',
      body: JSON.stringify({ username, password })
    });
    csrfToken = data.csrfToken || '';
    me = data;
    $('#loginPass').value = '';
    renderUser();
    renderPanels();
    if (me.role === 'owner') loadFiles();
    toast('登录成功，欢迎回来 ' + me.username, 'ok');
    if (me.mustChangePassword) toast('建议尽快修改初始密码', 'error');
  } catch (e) {
    toast(e.message, 'error');
  } finally {
    btn.disabled = false; btn.textContent = '登 录';
  }
};

async function doLogout(){
  try { await api('/api/logout', { method: 'POST' }); } catch (_) {}
  csrfToken = ''; me = null; myFiles = [];
  renderUser(); renderPanels();
  toast('已退出登录', 'ok');
}

/* ---------------- 文件选择 ---------------- */
const drop = $('#drop');
const fileInput = $('#fileInput');

drop.onclick = () => fileInput.click();
fileInput.onchange = () => {
  if (fileInput.files && fileInput.files[0]) setPicked(fileInput.files[0]);
};

['dragenter','dragover'].forEach(ev => {
  drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); });
});
['dragleave','drop'].forEach(ev => {
  drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); });
});
drop.addEventListener('drop', e => {
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) setPicked(f);
});

function setPicked(f){
  if (f.size > 500 * 1024 * 1024) return toast('文件超过 500 MB 上限', 'error');
  pickedFile = f;
  $('#pickedName').textContent = f.name;
  $('#pickedSize').textContent = fmtSize(f.size);
  $('#picked').classList.remove('hidden');
  drop.classList.add('hidden');
}

$('#clearPick').onclick = () => {
  pickedFile = null;
  fileInput.value = '';
  $('#picked').classList.add('hidden');
  drop.classList.remove('hidden');
};

/* ---------------- 上传 ---------------- */
$('#uploadBtn').onclick = () => {
  if (!pickedFile) return toast('请先选择文件', 'error');
  const pwd = $('#uploadPwd').value;
  if (pwd.length < 4 || pwd.length > 128) return toast('下载密码需 4-128 位', 'error');

  const btn = $('#uploadBtn');
  btn.disabled = true; btn.textContent = '上传中…';
  $('#progressBar').classList.remove('hidden');
  $('#progressTxt').classList.remove('hidden');
  $('#progressBar').querySelector('i').style.width = '0%';
  $('#progressTxt').textContent = '准备上传…';

  const fd = new FormData();
  fd.append('file', pickedFile);
  fd.append('password', pwd);
  fd.append('note', $('#uploadNote').value || '');

  const xhr = new XMLHttpRequest();
  xhr.open('POST', API_BASE + '/api/drive/upload');
  xhr.withCredentials = true;
  if (csrfToken) xhr.setRequestHeader('X-CSRF-Token', csrfToken);

  xhr.upload.onprogress = e => {
    if (!e.lengthComputable) return;
    const pct = Math.round(e.loaded / e.total * 100);
    $('#progressBar').querySelector('i').style.width = pct + '%';
    $('#progressTxt').textContent = `${pct}% · ${fmtSize(e.loaded)} / ${fmtSize(e.total)}`;
  };

  xhr.onload = () => {
    let data = null;
    try { data = JSON.parse(xhr.responseText); } catch (_) {}
    if (xhr.status >= 200 && xhr.status < 300 && data){
      toast('上传成功：' + data.name, 'ok');
      $('#uploadPwd').value = '';
      $('#uploadNote').value = '';
      $('#clearPick').click();
      $('#progressBar').classList.add('hidden');
      $('#progressTxt').classList.add('hidden');
      loadFiles();
    } else {
      toast((data && data.error) || '上传失败', 'error');
      $('#progressTxt').textContent = '上传失败';
    }
    btn.disabled = false; btn.textContent = '开始上传';
  };

  xhr.onerror = () => {
    toast('网络错误，上传失败', 'error');
    btn.disabled = false; btn.textContent = '开始上传';
  };

  xhr.send(fd);
};

/* ---------------- 文件列表 ---------------- */
async function loadFiles(){
  try {
    myFiles = await api('/api/drive/files');
    renderFiles();
  } catch (e) {
    $('#filesSub').textContent = '加载失败：' + e.message;
  }
}

function fileIcon(name){
  const ext = (name.split('.').pop() || '').toLowerCase();
  if (['zip','rar','7z','tar','gz'].includes(ext)) return '🗜️';
  if (['png','jpg','jpeg','gif','webp','svg','bmp'].includes(ext)) return '🖼️';
  if (['mp4','mkv','avi','mov','webm'].includes(ext)) return '🎬';
  if (['mp3','wav','flac','m4a','ogg'].includes(ext)) return '🎵';
  if (['pdf'].includes(ext)) return '📕';
  if (['doc','docx','txt','md'].includes(ext)) return '📝';
  if (['xls','xlsx','csv'].includes(ext)) return '📊';
  if (['exe','msi','apk','dmg'].includes(ext)) return '⚙️';
  return '📄';
}

function renderFiles(){
  const box = $('#fileList');
  const totalSize = myFiles.reduce((s, f) => s + (f.size || 0), 0);
  $('#filesSub').textContent = `共 ${myFiles.length} 个文件 · 占用 ${fmtSize(totalSize)}`;

  if (!myFiles.length){
    box.innerHTML = `<div class="empty"><span class="big">🪶</span>还没有上传任何文件</div>`;
    return;
  }

  box.innerHTML = myFiles.map(f => `
    <div class="file" data-id="${esc(f.id)}">
      <div class="fi">${fileIcon(f.name)}</div>
      <div class="fm">
        <div class="fn" title="${esc(f.name)}">${esc(f.name)}</div>
        <div class="meta">
          <span>${fmtSize(f.size)}</span>
          <span>${fmtTime(f.createdAt)}</span>
          <span>下载 ${f.downloads || 0} 次</span>
          ${f.note ? `<span class="tag">${esc(f.note)}</span>` : ''}
        </div>
      </div>
      <div class="acts">
        <button class="btn sm" data-act="copy">复制链接</button>
        <button class="btn sm" data-act="pwd">改密码</button>
        <button class="btn sm danger" data-act="del">删除</button>
      </div>
    </div>
  `).join('');

  box.querySelectorAll('.file').forEach(row => {
    const id = row.dataset.id;
    row.querySelector('[data-act="copy"]').onclick = () => {
      const link = location.origin + location.pathname + '?f=' + encodeURIComponent(id);
      copyText(link).then(ok => {
        toast(ok ? '分享链接已复制' : '链接：' + link, ok ? 'ok' : '');
      });
    };
    row.querySelector('[data-act="pwd"]').onclick = async () => {
      const np = prompt('请输入新的下载密码（4-128 位）：');
      if (np === null) return;
      if (np.length < 4 || np.length > 128) return toast('密码需 4-128 位', 'error');
      try {
        await api('/api/drive/files/' + encodeURIComponent(id), {
          method: 'PUT',
          body: JSON.stringify({ password: np })
        });
        toast('密码已更新', 'ok');
      } catch (e) { toast(e.message, 'error'); }
    };
    row.querySelector('[data-act="del"]').onclick = async () => {
      if (!confirm('确定要删除这个文件吗？此操作不可撤销。')) return;
      try {
        await api('/api/drive/files/' + encodeURIComponent(id), { method: 'DELETE' });
        toast('文件已删除', 'ok');
        loadFiles();
      } catch (e) { toast(e.message, 'error'); }
    };
  });
}

function copyText(text){
  if (navigator.clipboard && window.isSecureContext){
    return navigator.clipboard.writeText(text).then(() => true).catch(() => fallbackCopy(text));
  }
  return Promise.resolve(fallbackCopy(text));
}
function fallbackCopy(text){
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  } catch (_) { return false; }
}

/* ---------------- 提取下载 ---------------- */
$('#fetchBtn').onclick = doFetch;
$('#fetchPwd').addEventListener('keydown', e => { if (e.key === 'Enter') doFetch(); });

async function doFetch(){
  const id = $('#fetchId').value.trim();
  const pwd = $('#fetchPwd').value;
  if (!id) return toast('请输入文件 ID', 'error');
  if (!pwd) return toast('请输入下载密码', 'error');

  const btn = $('#fetchBtn');
  btn.disabled = true; btn.textContent = '验证中…';
  try {
    const data = await api('/api/drive/files/' + encodeURIComponent(id) + '/unlock', {
      method: 'POST',
      body: JSON.stringify({ password: pwd })
    });

    const url = API_BASE + '/api/drive/download/' + encodeURIComponent(id)
              + '?ticket=' + encodeURIComponent(data.ticket);

    const a = document.createElement('a');
    a.href = url;
    a.rel = 'noopener';
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => a.remove(), 1000);

    $('#fetchPwd').value = '';
    toast(`开始下载：${data.name}（${fmtSize(data.size)}）`, 'ok');
  } catch (e) {
    toast(e.message, 'error');
  } finally {
    btn.disabled = false; btn.textContent = '提取并下载';
  }
}

/* ---------------- 启动 ---------------- */
init();
</script>
</body>
