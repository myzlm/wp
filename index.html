<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>墨韵科技 · 云盘</title>
<meta name="description" content="墨韵科技云端存储">
<style>
:root{
  --bg:#f4f1e9;
  --panel:#fffdf9;
  --ink:#1b1b1b;
  --ink-2:#5a5750;
  --ink-3:#9a968d;
  --line:#e7e2d7;
  --accent:#2b4c7e;
  --accent-2:#3d67a3;
  --seal:#a83a2c;
  --ok:#2f7a53;
  --r:14px;
  --shadow:0 1px 2px rgba(30,25,15,.04), 0 12px 32px rgba(30,25,15,.07);
  --field-bg:#ffffff;
  --placeholder:#b9b5ac;
  --btn-hover-bg:#faf8f3;
  --btn-hover-border:#d9d3c5;
  --danger-border:#eddcd8;
  --danger-bg:#fdf4f2;
  --danger-border-hover:#e3c7c1;
  --drop-border:#d8d2c4;
  --drop-bg:#fdfbf6;
  --drop-hover-bg:#f7f9fd;
  --picked-bg:#f3f7fd;
  --picked-border:#d8e3f3;
  --bar-bg:#eae5da;
  --fi-bg:#f2efe7;
  --tag-bg:#eef3fb;
  --ok-border:#cbe6d6; --ok-bg:#f4fbf7; --ok-ink:#1f6b47;
  --err-border:#efd3cd; --err-bg:#fdf6f4; --err-ink:#9c3627;
}
html[data-theme="dark"]{
  --bg:#15130f;
  --panel:#1e1b16;
  --ink:#ece7dc;
  --ink-2:#b5afa2;
  --ink-3:#827c70;
  --line:#302b23;
  --accent:#5b82b8;
  --accent-2:#7399c9;
  --seal:#d0604f;
  --ok:#5aab7f;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 32px rgba(0,0,0,.45);
  --field-bg:#262219;
  --placeholder:#5d584d;
  --btn-hover-bg:#262219;
  --btn-hover-border:#3a352b;
  --danger-border:#4a2e28;
  --danger-bg:#2b1e1a;
  --danger-border-hover:#5c3a32;
  --drop-border:#3a352b;
  --drop-bg:#1a1712;
  --drop-hover-bg:#1e222b;
  --picked-bg:#1e2229;
  --picked-border:#2e3a4d;
  --bar-bg:#2a251d;
  --fi-bg:#262219;
  --tag-bg:#232c3a;
  --ok-border:#2c4a3a; --ok-bg:#18251e; --ok-ink:#7cc9a2;
  --err-border:#54322b; --err-bg:#2a1c18; --err-ink:#e08a7a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.6;
  font-size:15px;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(circle at 15% 8%, rgba(43,76,126,.055), transparent 45%),
    radial-gradient(circle at 85% 85%, rgba(168,58,44,.045), transparent 45%);
}
.wrap{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:0 18px 80px}

/* ---------- 顶栏 ---------- */
.topbar{
  position:relative;z-index:1;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  max-width:960px;margin:0 auto;padding:26px 18px 20px;
}
.brand{display:flex;align-items:center;gap:13px}
.seal{
  width:46px;height:46px;flex:0 0 46px;border-radius:11px;
  background:linear-gradient(145deg,#b8402f,#8d2a1f);
  color:#fff;display:grid;place-items:center;
  font-size:22px;font-weight:700;letter-spacing:1px;
  box-shadow:0 6px 16px rgba(168,58,44,.28);
  font-family:"Songti SC","STSong",serif;
}
.brand h1{margin:0;font-size:19px;font-weight:700;letter-spacing:2px}
.brand p{margin:1px 0 0;font-size:12px;color:var(--ink-3);letter-spacing:1.5px}
.user-area{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2)}
.user-chip{
  display:flex;align-items:center;gap:7px;
  background:var(--panel);border:1px solid var(--line);border-radius:999px;
  padding:6px 14px;box-shadow:0 1px 2px rgba(30,25,15,.03);
}
.user-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}

/* ---------- 卡片 ---------- */
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:24px;margin-bottom:20px;
}
.card h2{
  margin:0 0 4px;font-size:16px;font-weight:700;letter-spacing:1px;
  display:flex;align-items:center;gap:9px;
}
.card h2 .ico{font-size:18px}
.card .sub{margin:0 0 18px;font-size:13px;color:var(--ink-3)}

/* ---------- 表单 ---------- */
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--ink-2);margin-bottom:6px;font-weight:500}
.input{
  width:100%;padding:11px 14px;font-size:15px;font-family:inherit;
  background:var(--field-bg);border:1px solid var(--line);border-radius:10px;
  color:var(--ink);outline:none;transition:border-color .18s, box-shadow .18s;
}
.input:focus{border-color:var(--accent-2);box-shadow:0 0 0 3px rgba(61,103,163,.12)}
.input::placeholder{color:var(--placeholder)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:11px 22px;font-size:14px;font-family:inherit;font-weight:600;
  border-radius:10px;border:1px solid var(--line);background:var(--field-bg);color:var(--ink-2);
  cursor:pointer;transition:all .18s;letter-spacing:.5px;white-space:nowrap;
}
.btn:hover{background:var(--btn-hover-bg);border-color:var(--btn-hover-border)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn.primary{
  background:linear-gradient(145deg,var(--accent-2),var(--accent));
  border-color:transparent;color:#fff;
  box-shadow:0 4px 14px rgba(43,76,126,.25);
}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--seal);border-color:var(--danger-border)}
.btn.danger:hover{background:var(--danger-bg);border-color:var(--danger-border-hover)}
.btn.sm{padding:6px 13px;font-size:12.5px;border-radius:8px;font-weight:500}
.btn.block{width:100%}

/* ---------- 上传区 ---------- */
.drop{
  border:1.5px dashed var(--drop-border);border-radius:12px;padding:30px 20px;
  text-align:center;cursor:pointer;transition:all .2s;background:var(--drop-bg);
}
.drop:hover,.drop.over{border-color:var(--accent-2);background:var(--drop-hover-bg)}
.drop .big{font-size:30px;display:block;margin-bottom:8px;opacity:.75}
.drop .t{font-size:14px;color:var(--ink-2);font-weight:500}
.drop .h{font-size:12px;color:var(--ink-3);margin-top:5px}
.picked{
  display:flex;align-items:center;gap:11px;padding:12px 14px;
  background:var(--picked-bg);border:1px solid var(--picked-border);border-radius:11px;margin-bottom:14px;
}
.picked .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:500}
.picked .sz{font-size:12px;color:var(--ink-3);flex:0 0 auto}

.bar{height:6px;background:var(--bar-bg);border-radius:99px;overflow:hidden;margin:14px 0 6px}
.bar > i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--accent-2),var(--accent));transition:width .25s}
.bar-txt{font-size:12px;color:var(--ink-3);text-align:center}

/* ---------- 文件列表 ---------- */
.file{
  display:flex;align-items:center;gap:14px;padding:14px 4px;
  border-bottom:1px solid var(--line);
}
.file:last-child{border-bottom:none}
.file .fi{
  width:40px;height:40px;flex:0 0 40px;border-radius:10px;
  background:var(--fi-bg);display:grid;place-items:center;font-size:18px;
}
.file .fm{flex:1;min-width:0}
.file .fn{
  font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;margin-bottom:2px;
}
.file .meta{font-size:12px;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:4px 10px}
.file .meta .tag{
  background:var(--tag-bg);color:var(--accent);border-radius:5px;padding:0 6px;
  font-size:11px;line-height:17px;
}
.file .acts{display:flex;gap:6px;flex:0 0 auto;flex-wrap:wrap;justify-content:flex-end}

.empty{text-align:center;padding:34px 10px;color:var(--ink-3);font-size:13.5px}
.empty .big{font-size:32px;display:block;margin-bottom:10px;opacity:.4}

/* ---------- 提示 ---------- */
#toast{
  position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);
  z-index:99;display:flex;flex-direction:column;gap:9px;align-items:center;
  pointer-events:none;width:calc(100% - 32px);max-width:420px;
}
.toast{
  padding:11px 20px;border-radius:11px;font-size:13.5px;font-weight:500;
  background:var(--panel);border:1px solid var(--line);color:var(--ink);
  box-shadow:0 10px 30px rgba(30,25,15,.14);
  opacity:0;transform:translateY(12px);transition:all .28s;
  max-width:100%;
}
.toast.show{opacity:1;transform:translateY(0)}
.toast.ok{border-color:var(--ok-border);background:var(--ok-bg);color:var(--ok-ink)}
.toast.error{border-color:var(--err-border);background:var(--err-bg);color:var(--err-ink)}

.hidden{display:none !important}

/* ---------- 深色模式 ---------- */
html[data-theme="dark"] body::before{
  background:
    radial-gradient(circle at 15% 8%, rgba(115,153,201,.075), transparent 45%),
    radial-gradient(circle at 85% 85%, rgba(208,96,79,.055), transparent 45%);
}
body{transition:background-color .25s, color .25s}
.theme-btn{
  width:36px;height:36px;flex:0 0 36px;border-radius:50%;
  display:grid;place-items:center;line-height:1;font-size:15px;
  background:var(--panel);border:1px solid var(--line);cursor:pointer;
  box-shadow:0 1px 2px rgba(30,25,15,.03);transition:transform .18s, border-color .18s;
}
.theme-btn:hover{border-color:var(--btn-hover-border);transform:rotate(14deg)}

@media (max-width:620px){
  .card{padding:19px 16px}
  .file{flex-wrap:wrap}
  .file .acts{width:100%;justify-content:flex-start;padding-left:54px}
  .topbar{padding:18px 16px 14px}
  .brand h1{font-size:17px}
  .brand p{display:none}
}
</style>
<script>
/* 首帧前应用主题，避免闪白：优先用户记忆，其次跟随系统 */
(function(){
  try{
    var t = localStorage.getItem('moyun_theme');
    if (t !== 'dark' && t !== 'light') {
      t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.dataset.theme = t;
  }catch(e){ document.documentElement.dataset.theme = 'light'; }
})();
</script>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="seal">墨</div>
    <div>
      <h1>墨韵科技</h1>
      <p>云端存储 · 密码取件</p>
    </div>
  </div>
  <div class="user-area">
    <button class="theme-btn" id="themeBtn" title="切换深色 / 浅色模式">🌙</button>
    <span id="userArea"></span>
  </div>
</header>

<div class="wrap">

  <!-- 登录 -->
  <section class="card hidden" id="loginPanel">
    <h2><span class="ico">🔑</span>所有者登录</h2>
    <p class="sub">仅所有者可上传与管理文件，其他访客可直接使用下方提取功能</p>
    <div class="field">
      <label>用户名</label>
      <input class="input" id="loginUser" placeholder="请输入用户名" autocomplete="username">
    </div>
    <div class="field">
      <label>密码</label>
      <input class="input" id="loginPass" type="password" placeholder="请输入密码" autocomplete="current-password">
    </div>
    <button class="btn primary block" id="loginBtn">登 录</button>
  </section>

  <!-- 提取下载（所有人） -->
  <section class="card" id="fetchPanel">
    <h2><span class="ico">📦</span>提取文件</h2>
    <p class="sub">输入文件 ID 与下载密码，即可获取文件</p>
    <div class="field">
      <label>文件 ID</label>
      <input class="input" id="fetchId" placeholder="例如 3f2a9c10-... 或点击分享链接自动填写" spellcheck="false">
    </div>
    <div class="field">
      <label>下载密码</label>
      <input class="input" id="fetchPwd" type="password" placeholder="请输入下载密码" autocomplete="off">
    </div>
    <button class="btn primary block" id="fetchBtn">提取并下载</button>

    <!-- 分片下载进度 / 断点续传 -->
    <div class="bar hidden" id="dlBar" style="margin-top:10px"><i></i></div>
    <div class="bar-txt hidden" id="dlTxt"></div>
    <button class="btn block hidden" id="dlResume" style="margin-top:8px">继续下载（从断点开始）</button>
    <button class="btn danger block hidden" id="dlCancel" style="margin-top:8px">取消下载</button>
  </section>

  <!-- 上传（仅所有者） -->
  <section class="card hidden" id="uploadPanel">
    <h2><span class="ico">⬆️</span>上传文件</h2>
    <p class="sub">仅支持 .zip / .rar 压缩包 · 最大 10 GB · 自动 8MB 分片，失败自动重试，中断可断点续传</p>

    <div class="drop" id="drop">
      <span class="big">📁</span>
      <div class="t">点击选择文件，或将文件拖拽到此处</div>
      <div class="h">任意格式 · 单文件 ≤ 10 GB</div>
    </div>
    <input type="file" id="fileInput" class="hidden" accept=".zip,.rar">

    <div class="picked hidden" id="picked">
      <span style="font-size:19px">📄</span>
      <div class="nm" id="pickedName"></div>
      <div class="sz" id="pickedSize"></div>
      <button class="btn sm" id="clearPick">移除</button>
    </div>

    <div class="field">
      <label>下载密码（4-128 位，必填）</label>
      <input class="input" id="uploadPwd" type="text" placeholder="设置一个下载密码" autocomplete="off">
    </div>
    <div class="field">
      <label>备注（可选）</label>
      <input class="input" id="uploadNote" placeholder="例如：给张三的设计稿" maxlength="200">
    </div>

    <div class="bar hidden" id="progressBar"><i></i></div>
    <div class="bar-txt hidden" id="progressTxt"></div>

    <button class="btn primary block" id="uploadBtn" style="margin-top:6px">开始上传</button>
    <button class="btn danger block hidden" id="cancelUpload" style="margin-top:8px">取消上传</button>
    <button class="btn block hidden" id="retryUpload" style="margin-top:8px">继续上传（从断点开始）</button>
  </section>

  <!-- 本地导入（仅所有者）：登记手动放进服务器网盘目录的文件 -->
  <section class="card hidden" id="importPanel">
    <h2 style="justify-content:space-between">
      <span style="display:inline-flex;align-items:center;gap:9px">
        <span class="ico">📥</span>本地导入
      </span>
      <button class="btn sm" id="importScanBtn">扫描网盘目录</button>
    </h2>
    <p class="sub">手动拷到服务器网盘目录（drive 文件夹）里的文件不会自动出现在列表里，扫描后在这里登记即可纳入网盘管理；同时会检查"磁盘缺文件"的失效登记</p>
    <div id="importResult"></div>
  </section>

  <!-- 文件列表（仅所有者） -->
  <section class="card hidden" id="filesPanel">
    <h2 style="justify-content:space-between">
      <span style="display:inline-flex;align-items:center;gap:9px">
        <span class="ico">🗂️</span>我的文件
      </span>
      <button class="btn sm" id="refreshBtn">刷新</button>
    </h2>
    <p class="sub" id="filesSub">加载中…</p>
    <div id="fileList"></div>
  </section>

</div>

<div id="toast"></div>

<script>
/* ============================================================
   配置
   —— 前后端分离部署（本页在别的域名）：填后端完整地址
   —— 同源部署（本页放在后端同目录、由 server.js 提供）：改成 ''
   ============================================================ */
const API_BASE = 'https://myzlm.serveousercontent.com';

/* 单文件上限：10 GB，与后端 DRIVE_MAX_SIZE 保持一致 */
const MAX_FILE_SIZE = 10 * 1024 * 1024 * 1024;

/* ---------------- 基础工具 ---------------- */
const $ = s => document.querySelector(s);

let csrfToken = '';
let me = null;
let pickedFile = null;
let myFiles = [];

/* ---------------- 主题切换 ---------------- */
(function(){
  const btn = $('#themeBtn');
  const icon = () => document.documentElement.dataset.theme === 'dark' ? '☀️' : '🌙';
  btn.textContent = icon();
  btn.onclick = () => {
    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('moyun_theme', next); } catch (_) {}
    btn.textContent = icon();
  };
})();

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}

function fmtSize(n){
  if (typeof n !== 'number' || isNaN(n)) return '-';
  const u = ['B','KB','MB','GB','TB'];
  let i = 0, v = n;
  while (v >= 1024 && i < u.length - 1){ v /= 1024; i++; }
  return (i === 0 ? v : v.toFixed(v >= 100 ? 0 : 1)) + ' ' + u[i];
}

function fmtTime(iso){
  if (!iso) return '-';
  const d = new Date(iso);
  if (isNaN(d)) return '-';
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function toast(msg, type){
  const box = $('#toast');
  const el = document.createElement('div');
  el.className = 'toast ' + (type || '');
  el.textContent = msg;
  box.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => el.remove(), 320);
  }, 3200);
}

/* ---------------- 请求封装 ---------------- */
async function api(path, opts){
  opts = opts || {};
  const headers = Object.assign({}, opts.headers || {});
  if (opts.body && typeof opts.body === 'string') headers['Content-Type'] = 'application/json';
  const method = (opts.method || 'GET').toUpperCase();
  if (csrfToken && method !== 'GET' && method !== 'HEAD') headers['X-CSRF-Token'] = csrfToken;

  // 瞬态失败自动重试（网络错误 / 网关 5xx），退避 1s、2s；业务错误不重试直接抛
  let lastErr = null;
  for (let attempt = 0; attempt < 3; attempt++) {
    if (attempt) await new Promise(r => setTimeout(r, 1000 * attempt));
    let res;
    try {
      res = await fetch(API_BASE + path, Object.assign({}, opts, { headers, credentials: 'include', cache: 'no-store' }));
    } catch (e) {
      lastErr = new Error('无法连接服务器，请检查网络');
      continue;
    }
    if (res.status >= 500) {
      lastErr = new Error('服务暂时不可用（' + res.status + '）');
      continue;
    }
    const text = await res.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch (_) { data = { error: text }; }
    if (!res.ok) throw new Error((data && data.error) || ('请求失败（' + res.status + '）'));
    return data;
  }
  throw lastErr || new Error('无法连接服务器，请检查网络');
}

/* ---------------- 初始化 ---------------- */
async function init(){
  // 分享链接自动填 ID
  const params = new URLSearchParams(location.search);
  const fid = params.get('f') || params.get('id');
  if (fid) {
    $('#fetchId').value = fid;
    setTimeout(() => $('#fetchPwd').focus(), 300);
  }

  try {
    me = await api('/api/me');
  } catch (e) {
    toast(e.message, 'error');
    me = null;
  }

  if (me && me.csrfToken) csrfToken = me.csrfToken;
  renderUser();
  renderPanels();
  if (me && me.role === 'owner') loadFiles();
}

function renderUser(){
  const area = $('#userArea');
  if (me){
    const roleName = me.role === 'owner' ? '所有者' : me.role === 'admin' ? '管理员' : '成员';
    area.innerHTML =
      `<div class="user-chip"><span class="dot"></span>${esc(me.username)} · ${roleName}</div>
       <button class="btn sm" id="logoutBtn">退出</button>`;
    $('#logoutBtn').onclick = doLogout;
  } else {
    area.innerHTML = `<button class="btn sm" id="showLogin">所有者登录</button>`;
    $('#showLogin').onclick = () => {
      $('#loginPanel').classList.remove('hidden');
      $('#loginUser').focus();
      $('#loginPanel').scrollIntoView({ behavior:'smooth', block:'center' });
    };
  }
}

function renderPanels(){
  const isOwner = !!(me && me.role === 'owner');
  $('#loginPanel').classList.toggle('hidden', !!me);
  $('#uploadPanel').classList.toggle('hidden', !isOwner);
  $('#filesPanel').classList.toggle('hidden', !isOwner);
  $('#importPanel').classList.toggle('hidden', !isOwner);
  if (isOwner) scanImport();
}

/* ---------------- 登录 / 登出 ---------------- */

let activeXhr = null;      // 进行中的分片请求（用于取消）
let uploading = false;     // 上传中标记（防止误关页面）

/* 单个分片：PUT raw body，服务器返回权威进度 */
const CHUNK_STALL_MS = 20000;   // 20 秒没有任何字节进展视为链路停滞，主动放弃重试
function uploadChunk(uploadId, offset, blob){
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    activeXhr = xhr;
    let lastProg = Date.now();
    let stalled = false, done = false;
    const watch = setInterval(() => {
      if (!done && Date.now() - lastProg > CHUNK_STALL_MS) {
        stalled = true;
        try { xhr.abort(); } catch (_) {}
      }
    }, 2000);
    const finish = (fn) => {
      if (done) return;
      done = true;
      clearInterval(watch);
      fn();
    };
    xhr.open('PUT', API_BASE + '/api/drive/up/chunk'
      + '?uploadId=' + encodeURIComponent(uploadId)
      + '&offset=' + offset);
    xhr.withCredentials = true;
    xhr.timeout = 90000; // 兜底超时（停滞看门狗 20 秒会更早触发）
    if (csrfToken) xhr.setRequestHeader('X-CSRF-Token', csrfToken);
    xhr.setRequestHeader('Content-Type', 'application/octet-stream');
    if (xhr.upload) xhr.upload.onprogress = () => { lastProg = Date.now(); };
    xhr.onload = () => finish(() => {
      let data = null;
      try { data = JSON.parse(xhr.responseText); } catch (_) {}
      if (xhr.status >= 200 && xhr.status < 300 && data
          && typeof data.received === 'number') {
        resolve(data.received);
      } else {
        const err = new Error((data && data.error) || ('分片上传失败（HTTP ' + xhr.status + '）'));
        err.status = xhr.status; err.data = data;
        reject(err);
      }
    });
    xhr.onerror = () => finish(() => {
      const e = new Error('网络错误'); e.transient = true; reject(e);
    });
    xhr.ontimeout = () => finish(() => {
      const e = new Error('分片超时'); e.transient = true; reject(e);
    });
    xhr.onabort = () => finish(() => {
      if (stalled) {
        const e = new Error('分片 ' + Math.round(CHUNK_STALL_MS / 1000) + ' 秒无进展，链路停滞');
        e.transient = true; reject(e);
      } else {
        const e = new Error('已取消'); e.cancelled = true; reject(e);
      }
    });
    xhr.send(blob);
  });
}

async function runUpload(job){
  uploading = true;
  $('#cancelUpload').classList.remove('hidden');
  $('#retryUpload').classList.add('hidden');
  $('#uploadBtn').disabled = true;
  $('#uploadBtn').textContent = '上传中…';
  $('#progressBar').classList.remove('hidden');
  $('#progressTxt').classList.remove('hidden');
  setProgress(0, '准备上传…');

  try {
    // 1) 初始化 / 恢复会话
    if (!job.uploadId) {
      const info = await api('/api/drive/up/init', {
        method: 'POST',
        body: JSON.stringify({
          name: job.file.name,
          size: job.file.size,
          mime: job.file.type || '',
          password: job.pwd,
          note: job.note
        })
      });
      job.uploadId = info.uploadId;
      job.offset = info.received || 0;
      if (job.offset > 0) toast('检测到历史进度，从 ' + fmtSize(job.offset) + ' 处续传', 'ok');
    }

    // 2) 逐片上传，单片自动重试；弱网自动缩小分片（最低 1MB），链路顺畅后再逐步恢复
    let chunkSize = CHUNK_SIZE;
    let smooth = 0;                 // 连续成功计数
    while (job.offset < job.file.size) {
      let received = null, lastErr = null;

      for (let attempt = 0; attempt <= CHUNK_RETRIES; attempt++) {
        const end = Math.min(job.offset + chunkSize, job.file.size);
        const blob = job.file.slice(job.offset, end);
        try {
          received = await uploadChunk(job.uploadId, job.offset, blob);
          break;
        } catch (e) {
          if (e.cancelled) throw e;
          lastErr = e;
          // 偏移不连续：以服务器权威进度校正后续传
          if (e.status === 409 && e.data && typeof e.data.received === 'number') {
            received = e.data.received;
            break;
          }
          // 会话失效（服务器重启等）：自动重新初始化一次
          if (e.status === 404) {
            if (!job.reinited) {
              job.reinited = true;
              job.uploadId = null;
              job.offset = 0;
              toast('服务器会话已失效，自动从头重传', 'error');
              uploading = false;
              return runUpload(job);
            }
            throw e;
          }
          // 网络类失败（断连/超时/停滞/网关 5xx）：立即缩小分片再试
          if (e.transient || e.status >= 500) {
            chunkSize = Math.max(1024 * 1024, chunkSize >> 1);
            smooth = 0;
          }
          if (attempt < CHUNK_RETRIES) {
            setProgress(Math.round(job.offset / job.file.size * 100),
              '第 ' + (attempt + 1) + ' 次重试中…（分片 ' + fmtSize(chunkSize) + '）');
            await new Promise(r => setTimeout(r, Math.min(8000, 800 * Math.pow(2, attempt))));
          }
        }
      }
      if (received == null) throw (lastErr || new Error('分片上传失败'));

      job.offset = received;
      smooth++;
      if (smooth >= 4 && chunkSize < CHUNK_SIZE) {   // 连续 4 片顺利 → 分片逐级放大
        chunkSize = Math.min(CHUNK_SIZE, chunkSize << 1);
        smooth = 0;
      }
      const pct = Math.round(job.offset / job.file.size * 100);
      setProgress(pct, pct + '% · ' + fmtSize(job.offset) + ' / '
        + fmtSize(job.file.size) + ' · 已传 '
        + Math.ceil(job.offset / CHUNK_SIZE) + ' 片');
    }

    // 3) 完成校验转正
    const done = await api('/api/drive/up/complete', {
      method: 'POST',
      body: JSON.stringify({ uploadId: job.uploadId })
    });
    toast('上传成功：' + done.name + '（' + fmtSize(done.size) + '）', 'ok');
    uploadJob = null;
    $('#uploadPwd').value = '';
    $('#uploadNote').value = '';
    $('#clearPick').click();
    $('#progressBar').classList.add('hidden');
    $('#progressTxt').classList.add('hidden');
    loadFiles();
    resetUploadUI();
  } catch (e) {
    if (e.cancelled) {
      // 用户主动取消：清理服务器会话与临时文件
      if (uploadJob && uploadJob.uploadId) {
        try {
          await api('/api/drive/up/abort', {
            method: 'POST',
            body: JSON.stringify({ uploadId: uploadJob.uploadId })
          });
        } catch (_) {}
      }
      uploadJob = null;
      toast('上传已取消', '');
      $('#progressBar').classList.add('hidden');
      $('#progressTxt').classList.add('hidden');
      resetUploadUI();
    } else {
      // 失败但保留进度：可断点续传
      toast('上传中断：' + e.message + '，点"继续上传"可从断点恢复', 'error');
      $('#progressTxt').textContent = '已中断 · 已传 '
        + fmtSize(uploadJob ? uploadJob.offset : 0);
      resetUploadUI();
      $('#retryUpload').classList.remove('hidden');
    }
  }
}

function renderImport({ orphans = [], ghosts = [] }){
  const box = $('#importResult');

  if (!orphans.length && !ghosts.length){
    box.innerHTML = '<div class="empty"><span class="big">✨</span>网盘目录很干净：没有未登记的文件，也没有失效登记</div>';

  let html = '';
  if (orphans.length){
    html += '<p class="sub" style="margin-top:6px">发现 ' + orphans.length + ' 个未登记文件：</p>'
      + orphans.map(o => {
        const ok = o.isArchive && o.validMagic;
        const badge = ok
          ? '<span class="tag" style="color:#2e9e5b">压缩包校验通过</span>'
          : '<span class="tag" style="color:#c0392b">不是有效 zip/rar，无法导入</span>';
        return `
        <div class="file" data-sn="${esc(o.storedName)}">
          <div class="fi">${fileIcon(o.storedName)}</div>
          <div class="fm">
            <div class="fn" title="${esc(o.storedName)}">${esc(o.storedName)}</div>
            <div class="meta">
              <span>${fmtSize(o.size)}</span>
              <span>${fmtTime(o.mtime)}</span>
              ${badge}
            </div>
            ${ok ? `
            <div class="meta" style="margin-top:6px">
              <input class="input" data-role="name" style="flex:1;min-width:150px"
                     value="${esc(o.suggestedName)}" placeholder="显示名（.zip/.rar）" maxlength="255">
              <input class="input" data-role="pwd" style="flex:1;min-width:120px"
                     placeholder="下载密码（4-128 位）" autocomplete="off">
            </div>` : ''}
          </div>
          <div class="acts">
            ${ok ? '<button class="btn sm primary" data-act="import">登记入库</button>' : ''}
          </div>
        </div>`;
      }).join('');
  }

  if (ghosts.length){
    html += '<p class="sub" style="margin-top:10px">⚠️ ' + ghosts.length + ' 个失效登记（磁盘上文件已丢失）：</p>'
      + ghosts.map(g => `
        <div class="file" data-id="${esc(g.id)}">
          <div class="fi">💀</div>
          <div class="fm">
            <div class="fn">${esc(g.name)}</div>
            <div class="meta"><span>磁盘缺文件 ${esc(g.storedName)}</span></div>
          </div>
          <div class="acts">
            <button class="btn sm danger" data-act="ghost-del">清除登记</button>
          </div>
        </div>`).join('');
  }

  box.innerHTML = html;

  // 登记入库
  box.querySelectorAll('[data-act="import"]').forEach(btn => {
    btn.onclick = async () => {
      const row = btn.closest('.file');
      const storedName = row.dataset.sn;
      const name = row.querySelector('[data-role="name"]').value.trim();
      const password = row.querySelector('[data-role="pwd"]').value;
      if (password.length < 4 || password.length > 128) {
        return toast('下载密码需 4-128 位', 'error');
      }
      btn.disabled = true; btn.textContent = '登记中…';
      try {
        const done = await api('/api/drive/import', {
          method: 'POST',
          body: JSON.stringify({ storedName, name, password })
        });
        toast('导入成功：' + done.name + '（' + fmtSize(done.size) + '）', 'ok');
        loadFiles();
        scanImport();
      } catch (e) {
        toast(e.message, 'error');
        btn.disabled = false; btn.textContent = '登记入库';
      }
    };
  });

  // 清除幽灵登记（复用普通删除端点：磁盘文件本来就不存在，unlink 静默跳过）
  box.querySelectorAll('[data-act="ghost-del"]').forEach(btn => {
    btn.onclick = async () => {
      const row = btn.closest('.file');
      if (!confirm('确定清除这条失效登记吗？')) return;
      try {
        await api('/api/drive/files/' + encodeURIComponent(row.dataset.id), { method: 'DELETE' });
        toast('已清除失效登记', 'ok');
        loadFiles();
        scanImport();
      } catch (e) { toast(e.message, 'error'); }
    };
  });
}

function fileIcon(name){
  const ext = (name.split('.').pop() || '').toLowerCase();
  if (['zip','rar','7z','tar','gz'].includes(ext)) return '🗜️';
  if (['png','jpg','jpeg','gif','webp','svg','bmp'].includes(ext)) return '🖼️';
  if (['mp4','mkv','avi','mov','webm'].includes(ext)) return '🎬';
  if (['mp3','wav','flac','m4a','ogg'].includes(ext)) return '🎵';
  if (['pdf'].includes(ext)) return '📕';
  if (['doc','docx','txt','md'].includes(ext)) return '📝';
  if (['xls','xlsx','csv'].includes(ext)) return '📊';
  if (['exe','msi','apk','dmg'].includes(ext)) return '⚙️';
  return '📄';
}

function renderFiles(){
  const box = $('#fileList');
  const totalSize = myFiles.reduce((s, f) => s + (f.size || 0), 0);
  $('#filesSub').textContent = `共 ${myFiles.length} 个文件 · 占用 ${fmtSize(totalSize)}`;

  if (!myFiles.length){
    box.innerHTML = `<div class="empty"><span class="big">🪶</span>还没有上传任何文件</div>`;
    return;
  }

  box.innerHTML = myFiles.map(f => `
    <div class="file" data-id="${esc(f.id)}">
      <div class="fi">${fileIcon(f.name)}</div>
      <div class="fm">
        <div class="fn" title="${esc(f.name)}">${esc(f.name)}</div>
        <div class="meta">
          <span>${fmtSize(f.size)}</span>
          <span>${fmtTime(f.createdAt)}</span>
          <span>下载 ${f.downloads || 0} 次</span>
          ${f.note ? `<span class="tag">${esc(f.note)}</span>` : ''}
        </div>
      </div>
      <div class="acts">
        <button class="btn sm" data-act="copy">复制链接</button>
        <button class="btn sm" data-act="pwd">改密码</button>
        <button class="btn sm danger" data-act="del">删除</button>
      </div>
    </div>
  `).join('');

  box.querySelectorAll('.file').forEach(row => {
    const id = row.dataset.id;
    row.querySelector('[data-act="copy"]').onclick = () => {
      const link = location.origin + location.pathname + '?f=' + encodeURIComponent(id);
      copyText(link).then(ok => {
        toast(ok ? '分享链接已复制' : '链接：' + link, ok ? 'ok' : '');
      });
    };
    row.querySelector('[data-act="pwd"]').onclick = async () => {
      const np = prompt('请输入新的下载密码（4-128 位）：');
      if (np === null) return;
      if (np.length < 4 || np.length > 128) return toast('密码需 4-128 位', 'error');
      try {
        await api('/api/drive/files/' + encodeURIComponent(id), {
          method: 'PUT',
          body: JSON.stringify({ password: np })
        });
        toast('密码已更新', 'ok');
      } catch (e) { toast(e.message, 'error'); }
    };
    row.querySelector('[data-act="del"]').onclick = async () => {
      if (!confirm('确定要删除这个文件吗？此操作不可撤销。')) return;
      try {
        await api('/api/drive/files/' + encodeURIComponent(id), { method: 'DELETE' });
        toast('文件已删除', 'ok');
        loadFiles();
      } catch (e) { toast(e.message, 'error'); }
    };
  });
}

function copyText(text){
  if (navigator.clipboard && window.isSecureContext){
    return navigator.clipboard.writeText(text).then(() => true).catch(() => fallbackCopy(text));
  }
  return Promise.resolve(fallbackCopy(text));
}
function fallbackCopy(text){
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  } catch (_) { return false; }
}

const DL_CHUNK_MAX = 128 * 1024;  // 起始/最大分片：实测 serveo 隧道单连接响应体传到约 144KB(147456B) 必被掐断
const DL_CHUNK_MIN = 16 * 1024;   // 自适应下限：隧道进一步劣化时自动降档保命
const DL_GROW_AFTER = 12;         // 连续成功 N 片后尝试升档（隧道恢复时自动提速）
let DL_CHUNK = DL_CHUNK_MAX;      // 当前自适应分片大小（页面会话级）
let FETCH_SEQ = 0;                // 每次尝试使用唯一 URL：避免浏览器复用被掐断的连接池连接 / 中间缓存
const DL_PARALLEL = 3;            // 并行分片连接数：隧道单连接吞吐极低，多路并行弥补总速度
const DL_BODY_TIMEOUT = 45000;    // 单片响应体读取超时：被隧道掐死的连接可能不报错也不结束，
                                  // 若不主动掐断重试，写盘线程会永远等第一片，进度卡 0%
let dl = null; // { id, name, size, ticket, received, handle, writable, busy, ctrls }

  $('#dlTxt').textContent = '下载中 ' + pct + '% · ' + fmtSize(dl.received) + ' / ' + fmtSize(dl.size) + ' · 片' + Math.round(DL_CHUNK / 1024) + 'KB';
}

// 致命错误：重试也无法恢复（票据失效、文件丢失等）
class DlFatal extends Error {}

// 单片请求：网络类错误重试 3 次；403/404/400 等判定为致命直接抛 DlFatal
async function fetchChunk(url, start, end, signal){
  let lastErr = null;
  for (let attempt = 1; attempt <= 3; attempt++) {
    try {
      // 每次尝试用唯一 URL：防止复用可能已被掐断的 keep-alive 连接，也绕开任何忽略 Range 的中间缓存
      const resp = await fetch(url + '&_a=' + (++FETCH_SEQ), {
        headers: { Range: 'bytes=' + start + '-' + end },
        credentials: 'include',
        signal
      });
      if (resp.status === 206) return resp;
      // 非 206：必须先掐断响应体，否则连接被挂住，几次之后连接池耗尽、后续请求全部卡死
      try { if (resp.body) resp.body.cancel(); } catch (_) {}
      if (resp.status === 200) {
        // 服务器没按 Range 返回：多半是中间层剥了 Range 头，或 If-Range 回退成了全量。
        // 绝不能把全量响应当分片读（会把整个文件读进内存），直接判致命并说明原因
        throw new DlFatal('服务器未按分片返回（HTTP 200）：请检查隧道/代理是否剥离了 Range 请求头');
      }
      let d = null; try { d = await resp.json(); } catch (_) {}
      if (resp.status === 403 || resp.status === 404 || resp.status === 400) {
        throw new DlFatal((d && d.error) || ('HTTP ' + resp.status));
      }
      if (resp.status === 429) {
        // 限流不是分片大小问题：长退避等待，且不降档（降档只会让请求更频繁）
        lastErr = new Error((d && d.error) || '请求太频繁');
        await new Promise(r => setTimeout(r, 8000));
        continue;
      }
      lastErr = new Error((d && d.error) || ('HTTP ' + resp.status));
    } catch (e) {
      if (e.name === 'AbortError') throw e;
      if (e instanceof DlFatal) throw e;
      lastErr = e;
    }
    await new Promise(r => setTimeout(r, Math.min(1000 * attempt, 3000)));
  }
  throw (lastErr || new Error('下载失败'));
}

async function runDownload(){
  dl.busy = true;
  $('#dlResume').classList.add('hidden');
  $('#dlCancel').classList.remove('hidden');
  $('#dlBar').classList.remove('hidden');
  $('#dlTxt').classList.remove('hidden');
  dlProgress();

  const url = API_BASE + '/api/drive/download/' + encodeURIComponent(dl.id)
            + '?ticket=' + encodeURIComponent(dl.ticket);

  let nextOffset = dl.received;   // 下一个待抓取分片的偏移（ workers 之间同步领取，无竞争 ）
  let contiguous = dl.received;   // 已按序写盘的偏移（断点续传的真实进度）
  let stopped = false;            // 任一环节失败后叫停其他线程
  const ready = new Map();        // 乱序到达的分片缓存：offset -> ArrayBuffer
  dl.ctrls = new Set();           // 所有在途请求，用于取消
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  // 写盘线程：只按顺序消费连续分片，保证文件字节序正确
  async function writerLoop(){
    while (contiguous < dl.size) {
      if (stopped) throw new Error('已停止');
      const buf = ready.get(contiguous);
      if (!buf) { await sleep(25); continue; }
      ready.delete(contiguous);
      await dl.writable.write({ type: 'write', position: contiguous, data: buf });
      contiguous += buf.byteLength;
      dl.received = contiguous;
      dlProgress();
    }
  }

  // 抓取线程（DL_PARALLEL 路）：各领各的分片，乱序到达交给写盘线程排队
  async function worker(){
    let fails = 0, streak = 0;
    while (nextOffset < dl.size) {
      const start = nextOffset;
      const end = Math.min(start + DL_CHUNK, dl.size) - 1;
      nextOffset = end + 1;
      const ctrl = new AbortController();
      dl.ctrls.add(ctrl);
      try {
        const resp = await fetchChunk(url, start, end, ctrl.signal);
        const bodyP = resp.arrayBuffer();
        bodyP.catch(() => {});  // 竞态败者的拒绝不落成 unhandled rejection
        let buf;
        const timer = setTimeout(() => {
          try { ctrl.abort(); } catch (_) {}  // 看门狗到点：掐断挂死的连接
        }, DL_BODY_TIMEOUT);
        try {
          buf = await Promise.race([
            bodyP,
            new Promise((_, rej) => setTimeout(() => rej(new Error('BODY_TIMEOUT')), DL_BODY_TIMEOUT))
          ]);
        } catch (e) {
          if (e.message === 'BODY_TIMEOUT') throw new Error('分片响应超时');  // 转为可重试错误
          throw e;
        } finally {
          clearTimeout(timer);
        }
        if (buf.byteLength !== end - start + 1) {
          // 响应体被掐断（隧道劣化特征）：立刻降档，下次用更小的片试
          DL_CHUNK = Math.max(DL_CHUNK_MIN, Math.floor(DL_CHUNK / 2));
          throw new Error('分片不完整（收到 ' + buf.byteLength + '/' + (end - start + 1) + ' 字节）');
        }
        ready.set(start, buf);
        if (++streak >= DL_GROW_AFTER && DL_CHUNK < DL_CHUNK_MAX) {
          DL_CHUNK = Math.min(DL_CHUNK_MAX, DL_CHUNK * 2);  // 隧道稳定：逐步升档提速
          streak = 0;
        }
        fails = 0;
      } catch (e) {
        nextOffset = start;  // 分片归还，稍后重领
        if (e.name === 'AbortError' || e instanceof DlFatal) throw e;
        if (++fails > 60) throw new Error('网络持续不可用');
        DL_CHUNK = Math.max(DL_CHUNK_MIN, Math.floor(DL_CHUNK / 2));  // 失败即降档：128K→64K→32K→16K
        await sleep(5000);   // 网络波动：5 秒后自动重试，不中断整体
      } finally {
        dl.ctrls.delete(ctrl);
      }
    }
  }

  try {
    const runners = [writerLoop()];
    const nWorkers = Math.min(DL_PARALLEL, Math.ceil((dl.size - dl.received) / DL_CHUNK));
    for (let i = 0; i < nWorkers; i++) runners.push(worker());
    await Promise.all(runners);
    await dl.writable.close();
    // 落盘校验：磁盘上的文件必须和源文件一样大，否则不谎报成功
    const saved = await dl.handle.getFile().catch(() => null);
    dl.writable = null;
    if (saved && saved.size === dl.size) {
      toast('下载完成：' + dl.name, 'ok');
    } else {
      const got = saved ? fmtSize(saved.size) : '未知';
      toast('下载完成但文件校验异常（磁盘 ' + got + ' / 应为 ' + fmtSize(dl.size) + '），建议删除后重新下载', 'error');
    }
    dl = null;
    hideDlUI();
  } catch (e) {
    stopped = true;
    for (const c of dl.ctrls) { try { c.abort(); } catch (_) {} }
    if (e.name === 'AbortError') {
      toast('下载已取消', '');
      dl = null; // 不 close，浏览器会丢弃临时写入
      hideDlUI();
    } else {
      $('#dlTxt').textContent = '下载停止：' + e.message + '（已保存 ' + fmtSize(dl ? dl.received : 0) + '）';
      $('#dlResume').classList.remove('hidden');
      toast('下载停止：' + e.message, 'error');
      toast('反复失败？请 Ctrl+F5 强制刷新页面，且必须用 https://myzlm.github.io/wp/ 打开（本地 file:// 打开必然失败）', '');
    }
  } finally {
    stopped = true;
    for (const c of (dl && dl.ctrls || [])) { try { c.abort(); } catch (_) {} }
    if (dl) { dl.ctrls.clear(); dl.busy = false; }
    $('#dlCancel').classList.add('hidden');
  }
}

// 兜底：浏览器不支持 File System Access API 时，走原生下载（后端 Range/长票据仍支持浏览器自身续传）
function fallbackDirect(url, name){
  const a = document.createElement('a');
  a.href = url;
  a.rel = 'noopener';
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => a.remove(), 1000);
  toast('已开始下载：' + name, 'ok');
}

async function doFetch(){
  const id = $('#fetchId').value.trim();
  const pwd = $('#fetchPwd').value;
  if (!id) return toast('请输入文件 ID', 'error');
  if (!pwd) return toast('请输入下载密码', 'error');
  if (dl && dl.busy) return toast('已有下载进行中', 'error');

  const btn = $('#fetchBtn');
  btn.disabled = true; btn.textContent = '验证中…';
  try {
    const data = await api('/api/drive/files/' + encodeURIComponent(id) + '/unlock', {
      method: 'POST',
      body: JSON.stringify({ password: pwd })
    });

    const url = API_BASE + '/api/drive/download/' + encodeURIComponent(id)
              + '?ticket=' + encodeURIComponent(data.ticket);

    if (window.showSaveFilePicker) {
      // 分片下载：逐片拉取写盘，失败可从断点恢复
      let handle = null;
      try {
        handle = await window.showSaveFilePicker({ suggestedName: data.name });
      } catch (pe) {
        if (pe && pe.name === 'AbortError') throw pe; // 用户主动取消
        // SecurityError/NotAllowedError：验证密码耗时太久、用户手势过期 → 退回原生下载
        $('#fetchPwd').value = '';
        toast('浏览器不允许此时弹窗，已改用浏览器直接下载', '');
        fallbackDirect(url, data.name);
        return;
      }
      const writable = await handle.createWritable();
      dl = {
        id, name: data.name, size: data.size, ticket: data.ticket,
        received: 0, handle, writable, busy: false, ctrls: null
      };
      $('#fetchPwd').value = '';
      toast('开始下载：' + data.name + '（' + fmtSize(data.size) + '）', 'ok');
      runDownload();
    } else {
      $('#fetchPwd').value = '';
      fallbackDirect(url, data.name);
    }
  } catch (e) {
    if (e && e.name === 'AbortError') {
      toast('已取消选择保存位置', '');
    } else {
      toast(e.message, 'error');
    }
  } finally {
    btn.disabled = false; btn.textContent = '提取并下载';
  }
}

// 断点续传：复用票据与已选文件句柄，从 received 处接着拉
$('#dlResume').onclick = async () => {
  if (!dl || dl.busy) return;
  try {
    // keepExistingData: 必须保留已写入内容；否则文件被清零后从中间偏移写入，
    // 文件大小对了但前半截全是 0（压缩包打不开 = "下载没成功"）
    if (!dl.writable) dl.writable = await dl.handle.createWritable({ keepExistingData: true });
  } catch (_) {
    return toast('无法继续写入已选文件，请重新提取', 'error');
  }
  runDownload();
};

$('#dlCancel').onclick = () => {
  if (dl && dl.ctrls) for (const c of dl.ctrls) { try { c.abort(); } catch (_) {} }
};

/* ---------------- 启动 ---------------- */
// 本地 file:// 打开的页面会被浏览器 CORS 拦截所有响应（服务端照常发送但页面读不到），
// 表现为上传/下载无限重试失败——必须第一时间告知用户，避免"后端正常但客户端永远失败"
if (location.protocol === 'file:') {
  const b = document.createElement('div');
  b.style.cssText = 'position:sticky;top:0;z-index:999;background:var(--seal,#a83a2c);color:#fff;padding:10px 16px;font-size:13px;line-height:1.5;text-align:center';
  b.innerHTML = '⚠️ 你正在用本地文件（file://）打开本页面，浏览器会拦截所有跨域请求，<b>上传和下载必然失败</b>。<br>请访问正式地址：<b>https://myzlm.github.io/wp/</b>';
  document.body.prepend(b);
}
init();
</script>
